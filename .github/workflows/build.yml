name: Build GKI Kernel

# 为 Redmi K90 Ultra (warsaw / SM8750 / 6.6) 构建集成 KernelSU 系 root 与 SUSFS 的 GKI 内核
# 手动触发：Actions → Build GKI Kernel → Run workflow
#
# root_manager 默认为 all：一次运行把所有 root 管理器（kernelsu-next / kernelsu / bakasu /
# sukisu-ultra / kowsu）各出一份 AnyKernel3 刷机包，并行构建，互不影响。

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "构建预设：full = 按下面的开关全量构建（默认）；safe = 只留 root + SUSFS；vanilla = 不集成任何东西，只验证基础内核"
        type: choice
        required: true
        default: safe
        options:
          - full
          - safe
          - vanilla
      variants:
        description: "想一次并行构建多个预设时填写，逗号分隔（例如 full,safe）；留空则只构建上面的 preset"
        type: string
        # 卡 Logo 二分：一次并行出 vanilla（纯 GKI）和 safe（root + SUSFS），
        # 两个包同一轮跑完即可判定问题在基础内核还是补丁层。
        default: "vanilla,safe"
      root_manager:
        description: "Root 管理器：all = 全部（每个管理器各出一个包）；也可以只选一个"
        type: choice
        required: true
        default: bakasu
        options:
          - all
          - kernelsu-next
          - kernelsu
          - bakasu
          - sukisu-ultra
          - kowsu
          - none
      root_ref:
        description: "Root 仓库分支 / tag / commit（留空 = 默认分支最新；选 all 时对所有管理器生效）"
        type: string
        default: ""

      lto:
        description: "LTO 模式。官方 GKI release 用 thin（最接近出厂）；none 编得更快但内核二进制与官方不同"
        type: choice
        required: true
        default: thin
        options:
          - thin
          - full
          - none

      config_mode:
        description: "配置来源：overlay = 在官方 gki_defconfig 上叠加本仓库的开关；device = 直接用 config/device/gki_defconfig（手机出厂配置）；pristine = 一个字都不改，纯 ACK 参考内核（配合 preset=vanilla 排查）"
        type: choice
        required: true
        default: overlay
        options:
          - overlay
          - device
          - pristine

      susfs:
        description: "SUSFS（root 隐藏，建议开启）。KowSU 与 SUSFS 不兼容，选 all 时 kowsu 那份会自动关闭 SUSFS"
        type: boolean
        default: true
      nomount:
        description: "NoMount（VFS 层无挂载点伪装）"
        type: boolean
        default: false
      bbg:
        description: "Baseband Guard（基带分区保护）"
        type: boolean
        default: false
      droidspaces:
        description: "DroidSpaces-OSS（容器运行时）"
        type: boolean
        default: false
      networking:
        description: "Networking（BBRv3 / WireGuard / IPSet / CIFS）"
        type: boolean
        default: false
      ntsync:
        description: "NTSync（Proton / Wine 同步原语）"
        type: boolean
        default: false
      ptrace_fix:
        description: "Ptrace Leak Fix（6.6 已包含在 SUSFS 补丁内）"
        type: boolean
        default: false
      unicode_fix:
        description: "Unicode Fix（修复 /proc 名称绕过）"
        type: boolean
        default: false
      bpf:
        description: "BTF / eBPF / FUSE-BPF"
        type: boolean
        default: false

      page_size:
        description: "内核页大小"
        type: choice
        required: true
        default: 4k
        options:
          - 4k
          - 16k

      manifest_branch:
        description: "GKI 源码清单分支（默认跟踪 6.6 LTS；机型出厂为 6.6.118，与该线最新一致）"
        type: string
        default: common-android15-6.6-lts
      kernel_release:
        description: "目标内核版本（推荐填手机的版本，如 6.6.118）：自动把源码锁定到同版本的 ACK 发布 tag，避免用比手机新几十个 stable 的源码"
        type: string
        default: ""

      kernel_tag:
        description: "直接指定 ACK 发布 tag（如 android15-6.6-2025-12_r3）。填了就忽略 kernel_release；两者都留空 = 用分支最新"
        type: string
        default: ""
      stock_kernel_version:
        description: "版本对齐（例如 6.6.57）：把内核版本改成出厂版本，仅在 vendor 模块 vermagic 不匹配时使用"
        type: string
        default: ""
      susfs_branch:
        description: "susfs4ksu 分支"
        type: string
        default: gki-android15-6.6
      brand:
        description: "包名前缀"
        type: string
        default: K90Ultra

      release:
        description: "发布方式：release = 正式 Release；prerelease = 预发布（GitHub 上标记 Pre-release，不会出现在 /releases/latest）；none = 不发布，只留 Artifacts"
        type: choice
        required: true
        default: release
        options:
          - release
          - prerelease
          - none

permissions:
  contents: write

concurrency:
  group: build-gki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 把 "preset / variants / root_manager" 解析成一张构建矩阵：
  #   预设 × root 管理器 → 每个组合一个并行 job、一份 AK3 包
  # （选 all 时默认就是 full × 5 个管理器，一次运行出全部刷机包）
  resolve:
    name: 解析构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      count: ${{ steps.parse.outputs.count }}
    steps:
      - name: 解析 preset / variants / root_manager
        id: parse
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          VARIANTS: ${{ inputs.variants }}
          ROOT_MANAGER: ${{ inputs.root_manager }}
          SUSFS: ${{ inputs.susfs }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          # 所有受支持的 root 管理器（顺序即矩阵顺序）
          ALL_ROOTS = ["kernelsu-next", "kernelsu", "bakasu", "sukisu-ultra", "kowsu"]
          ALLOWED_PRESETS = {"safe", "full", "vanilla"}
          ALLOWED_ROOTS = set(ALL_ROOTS) | {"none"}

          def truthy(value):
              return str(value or "").strip().lower() in {"1", "true", "yes", "on"}

          # --- 预设（variants 优先，逗号分隔） ---
          raw_presets = (os.environ.get("VARIANTS") or "").strip() or os.environ["PRESET"]
          presets = []
          for part in raw_presets.split(","):
              name = part.strip().lower()
              if not name:
                  continue
              if name not in ALLOWED_PRESETS:
                  raise SystemExit(f"未知预设: {name}（可选 safe / full / vanilla）")
              if name not in presets:
                  presets.append(name)
          if not presets:
              raise SystemExit("没有解析出任何预设")

          # --- root 管理器（all = 全部） ---
          raw_root = (os.environ.get("ROOT_MANAGER") or "").strip().lower() or "all"
          if raw_root == "all":
              roots = list(ALL_ROOTS)
          elif raw_root in ALLOWED_ROOTS:
              roots = [raw_root]
          else:
              raise SystemExit(f"未知 Root 管理器: {raw_root}")

          susfs_requested = truthy(os.environ.get("SUSFS"))

          entries = []
          seen = set()
          notes = []
          for preset in presets:
              for root in roots:
                  # vanilla 不集成任何 root，多个 root 只会产出完全相同的包，收敛成一份
                  actual_root = "none" if preset == "vanilla" else root
                  susfs = susfs_requested and actual_root != "none" and preset != "vanilla"
                  if susfs and actual_root == "kowsu":
                      susfs = False
                      notes.append(f"{preset} / kowsu：KowSU 与 SUSFS 不兼容，该包自动关闭 SUSFS")
                  key = (preset, actual_root, susfs)
                  if key in seen:
                      continue
                  seen.add(key)
                  entries.append({"preset": preset, "root": actual_root, "susfs": susfs})

          for note in notes:
              print(f"[!] {note}", file=sys.stderr)
          print(f"将构建 {len(entries)} 个包: " + ", ".join(f"{e['preset']}/{e['root']}" for e in entries),
                file=sys.stderr)

          # 写运行摘要，方便一眼看清这一轮到底会出哪些包
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(f"### 构建矩阵（共 {len(entries)} 个包）\n\n")
                  fh.write("| # | 预设 | Root 管理器 | SUSFS |\n| --- | --- | --- | --- |\n")
                  for idx, entry in enumerate(entries, start=1):
                      fh.write(f"| {idx} | `{entry['preset']}` | `{entry['root']}` | "
                               f"{'✅' if entry['susfs'] else '—'} |\n")
                  fh.write("\n")
                  for note in notes:
                      fh.write(f"> [!] {note}\n")
                  if notes:
                      fh.write("\n")

          print(f"matrix={json.dumps(entries, separators=(',', ':'))}")
          print(f"count={len(entries)}")
          PY
          cat "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: ${{ matrix.preset }} / ${{ matrix.root }} / ${{ inputs.page_size }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    env:
      PRESET: ${{ matrix.preset }}
      ROOT_MANAGER: ${{ matrix.root }}
      ROOT_REF: ${{ inputs.root_ref }}
      SUSFS: ${{ matrix.susfs }}
      NOMOUNT: ${{ inputs.nomount }}
      BBG: ${{ inputs.bbg }}
      DROIDSPACES: ${{ inputs.droidspaces }}
      NETWORKING: ${{ inputs.networking }}
      NTSYNC: ${{ inputs.ntsync }}
      PTRACE_FIX: ${{ inputs.ptrace_fix }}
      UNICODE_FIX: ${{ inputs.unicode_fix }}
      BPF: ${{ inputs.bpf }}
      CONFIG_MODE: ${{ inputs.config_mode }}
      LTO: ${{ inputs.lto }}
      PAGE_SIZE: ${{ inputs.page_size }}
      MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
      KERNEL_TAG: ${{ inputs.kernel_tag }}
      KERNEL_RELEASE: ${{ inputs.kernel_release }}
      STOCK_KERNEL_VERSION: ${{ inputs.stock_kernel_version }}
      SUSFS_BRANCH: ${{ inputs.susfs_branch }}
      BRAND: ${{ inputs.brand }}
      ALLOW_PATCH_FUZZ: "true"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        # GKI 全量 repo sync + Kleaf 构建需要 ~60GB 空闲空间
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 增加 Swap（LTO / 并行链接需要）
        run: |
          set -euo pipefail
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex zip unzip python3 git curl ca-certificates
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - name: 准备源码与补丁
        run: bash scripts/prepare.sh

      - name: 编译内核
        run: bash scripts/build.sh

      - name: 打包 AnyKernel3
        run: bash scripts/package.sh

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: 上传内核配置与构建说明
        uses: actions/upload-artifact@v4
        with:
          name: build-config-and-info-${{ matrix.preset }}-${{ matrix.root }}
          path: |
            out/kernel.config
            out/build-info.md
          if-no-files-found: warn

      - name: 上传补丁 rejects（如果有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects-${{ matrix.preset }}-${{ matrix.root }}
          path: patch-rejects/
          if-no-files-found: ignore

      - name: 构建摘要
        if: always()
        run: |
          {
            echo "### 构建结果：${{ matrix.preset }} / ${{ matrix.root }}"
            echo
            echo "- Root：\`${{ matrix.root }}\`，SUSFS：\`${{ matrix.susfs }}\`，页大小：\`${{ inputs.page_size }}\`"
            echo "- 源码：\`${{ inputs.manifest_branch }}\`"
            echo "- 产物：\`${{ env.ZIP_NAME }}\`"
            [ -f out/build-info.md ] && cat out/build-info.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布 Release
        if: ${{ inputs.release != 'none' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.ZIP_NAME }}
          body_path: out/build-info.md
          files: ${{ env.ZIP_PATH }}
          # release / prerelease 的区别就是 GitHub 的 Pre-release 标记
          prerelease: ${{ inputs.release == 'prerelease' }}
          # 一次运行会出多个包（每个管理器一个），不抢 "Latest" 标签，避免每次随机落到某个管理器上
          make_latest: false
          fail_on_unmatched_files: true

  # 所有并行 job 跑完后，在运行页面上给一张"这一轮都出了什么"的总表
  report:
    name: 汇总
    needs: [resolve, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总本轮产物
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
          BUILD_RESULT: ${{ needs.build.result }}
          PAGE_SIZE: ${{ inputs.page_size }}
          SUSFS_BRANCH: ${{ inputs.susfs_branch }}
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
          RELEASE_MODE: ${{ inputs.release }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os

          entries = json.loads(os.environ.get("MATRIX") or "[]")
          mode = os.environ.get("RELEASE_MODE", "")
          mode_label = {
              "release": "正式 Release",
              "prerelease": "预发布（Pre-release）",
              "none": "不发布（只留 Artifacts）",
          }.get(mode, mode or "未知")

          print("### 本轮构建汇总\n")
          print(f"- 矩阵任务数：`{len(entries)}`")
          print(f"- 矩阵整体结果：`{os.environ.get('BUILD_RESULT', 'unknown')}`")
          print(f"- 发布方式：{mode_label}")
          print(f"- 页大小：`{os.environ.get('PAGE_SIZE', '')}`，源码：`{os.environ.get('MANIFEST_BRANCH', '')}`，"
                f"SUSFS 分支：`{os.environ.get('SUSFS_BRANCH', '')}`")
          print()
          if entries:
              print("| 预设 | Root 管理器 | SUSFS | 需要的管理器 APK |")
              print("| --- | --- | --- | --- |")
              apk = {
                  "kernelsu": "KernelSU",
                  "kernelsu-next": "KernelSU Next",
                  "bakasu": "BakaSU",
                  "sukisu-ultra": "SukiSU-Ultra",
                  "kowsu": "KowSU",
                  "none": "不需要",
              }
              for entry in entries:
                  root = entry.get("root", "none")
                  print(f"| `{entry.get('preset')}` | `{root}` | "
                        f"{'✅' if entry.get('susfs') else '—'} | {apk.get(root, '?')} |")
              print()
          print("> 每个 root 管理器的内核签名不同，**必须装对应的管理器 APK**，装错会显示“未安装”。")
          print("> 一次只能刷一个包；换管理器时要重新刷对应那份 AK3，不能只换 APK。")
          PY
