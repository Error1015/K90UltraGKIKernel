name: Build K90 Ultra GKI

# ---------------------------------------------------------------------------
# 只服务 Redmi K90 Ultra（warsaw）。一次运行产出所选 root 的一套文件：
#   boot-warsaw-<root>-<ver>.img   96MB 完整 boot 分区镜像，fastboot flash boot
#   ak3-warsaw-<root>-<ver>.zip    AnyKernel3 包（内部就是同一个完整镜像，只做 dd）
#
# 镜像里含 vbmeta blob 与 AVB footer（ramdisk_size=0），换内核时必须整体重打包 ——
# 所以 AK3 走的是"写整分区镜像"，不是传统的"只换内核再 repack"。
#
# 内核版本/tag/版本串/页大小/分区大小全部锁在 project/device.env。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      # 内核版本 / tag / 版本串 / 页大小 / 分区大小全部锁在 project/device.env，
      # 不再作为输入暴露 —— 这个仓库只服务 K90 Ultra 一台机器，填错只会编出 KMI 不匹配的包。
      root:
        description: 'root 实现（bakasu 单个 / all 一次出全部 5 个）'
        type: choice
        options: [bakasu, all, sukisu-ultra, kernelsu, kernelsu-next, kowsu, none]
        default: bakasu
      susfs:
        description: 'SUSFS（选 kowsu 时会自动关掉）'
        type: boolean
        default: true

      # ---- 附加功能（默认全关，一次只加一层）----
      nomount:
        description: '附加：NoMount（VFS 层无挂载点伪装）'
        type: boolean
        default: false
      bbg:
        description: '附加：Baseband Guard（保护 efs/modem）'
        type: boolean
        default: false
      ntsync:
        description: '附加：NTSync（Proton/Wine 同步原语）'
        type: boolean
        default: false
      networking:
        description: '附加：BBRv3 + IPSet + CIFS'
        type: boolean
        default: false
      bpf:
        description: '附加：BTF/eBPF（出厂已是 y，一般无需勾）'
        type: boolean
        default: false
      droidspaces:
        description: '附加：DroidSpaces 容器所需 namespace'
        type: boolean
        default: false
      unicode:
        description: '附加：Unicode 绕过修复'
        type: boolean
        default: false

      release:
        description: '发布方式'
        type: choice
        options: [release, prerelease, none]
        default: release
      publish_run_id:
        description: '只发布：填一次成功运行的 run id，直接取那次产物发 Release，不重新编译'
        required: false
        default: ''

permissions:
  contents: write
  # 下载历史运行的产物（publish_run_id）需要 actions:read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 先算矩阵。
  # GitHub 的 job 级 if 是在展开矩阵之前求值的，那里没有 matrix 上下文
  # （写 if: matrix.xxx 会直接报 Unrecognized named-value: 'matrix'），
  # 所以"要不要跑第二条腿"必须在这一步决定，输出一个干净的 JSON。
  # ---------------------------------------------------------------------------
  resolve:
    name: resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        shell: bash
        env:
          ROOT_INPUT: ${{ inputs.root }}
          SUSFS_INPUT: ${{ inputs.susfs }}
          NOMOUNT_INPUT: ${{ inputs.nomount }}
          BBG_INPUT: ${{ inputs.bbg }}
          NTSYNC_INPUT: ${{ inputs.ntsync }}
          NETWORKING_INPUT: ${{ inputs.networking }}
          BPF_INPUT: ${{ inputs.bpf }}
          DROIDSPACES_INPUT: ${{ inputs.droidspaces }}
          UNICODE_INPUT: ${{ inputs.unicode }}
        run: |
          set -euo pipefail
          M="$(python3 project/matrix.py)"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "构建矩阵: $M"

  build:
    name: ${{ matrix.name }}
    needs: resolve
    # 填了 publish_run_id 就只走发布，不重新编译
    if: ${{ inputs.publish_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    env:
      ROOT_IMPL: ${{ matrix.root }}
      SUSFS: ${{ matrix.susfs }}
      NOMOUNT: ${{ matrix.nomount }}
      BBG: ${{ matrix.bbg }}
      NTSYNC: ${{ matrix.ntsync }}
      NETWORKING: ${{ matrix.networking }}
      BPF: ${{ matrix.bpf }}
      DROIDSPACES: ${{ matrix.droidspaces }}
      UNICODE: ${{ matrix.unicode }}
      VARIANT: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把锁定的机型/内核基准导出成环境变量，后面的 shell 步骤和
      # ${{ env.* }} 表达式都用它（各脚本自己也会 source device.env，值一致）
      - name: 读取锁定的机型/内核基准
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^[A-Z][A-Z0-9_]*=' project/device.env >> "$GITHUB_ENV"
          ( set -a; . project/device.env; set +a
            echo "内核基准：$KERNEL_RELEASE / $KERNEL_TAG / $LOCALVERSION" )

      - name: 清理磁盘
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -1

      - name: 安装依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 rsync cpio kmod zip unzip dwarves git curl ca-certificates
          pahole --version || true

      - name: 准备源码 / root / 补丁 / 配置
        shell: bash
        run: bash project/prepare.sh 2>&1 | tee prepare.log

      - name: 编译内核
        shell: bash
        run: bash project/build.sh 2>&1 | tee build-step.log

      # 编译挂了也把日志留下，否则 if-no-files-found: error 会让产物步骤失败、日志一起丢掉，
      # 只剩一个空摘要，排查只能靠猜。
      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: |
            prepare.log
            build-step.log
            kernel/out/build.log
            kernel/out/olddefconfig.log
          if-no-files-found: ignore
          compression-level: 9

      - name: 打包 boot.img（AVB 感知）
        shell: bash
        run: |
          set -euo pipefail
          NAME="boot-warsaw-${{ matrix.name }}-${KERNEL_RELEASE}"
          python3 project/pack.py pack dist/Image "dist/${NAME}.img"
          echo "BOOT_NAME=${NAME}" >> "$GITHUB_ENV"

      # AK3 包只把上面那个完整镜像 dd 进 boot 分区，不在设备上重打包
      # （重打包会丢 vbmeta 与 AVB footer，就是之前卡 logo 的原因）
      - name: 打包 AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          AK3="ak3-warsaw-${{ matrix.name }}-${KERNEL_RELEASE}"
          bash project/ak3.sh "dist/${BOOT_NAME}.img" "dist/${AK3}.zip" \
            "warsaw GKI ${KERNEL_RELEASE} · ${{ matrix.name }}" "warsaw"
          echo "AK3_NAME=${AK3}" >> "$GITHUB_ENV"

      - name: 产物验收
        shell: bash
        run: |
          set -euo pipefail
          python3 project/verify.py \
            --boot "dist/${BOOT_NAME}.img" \
            --image dist/Image \
            --root "${ROOT_IMPL}" \
            --susfs "${SUSFS}" \
            --sublevel "${KERNEL_RELEASE##*.}" \
            --out "dist/build-info-${{ matrix.name }}.md"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOOT_NAME }}
          path: |
            dist/*.img
            dist/*.zip
            dist/Image
            dist/build-info-*.md
            dist/kernel-version.txt
            prepare.log
            build-step.log
          if-no-files-found: error
          compression-level: 1

      - name: 收集补丁 reject（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejects-${{ matrix.name }}
          path: patch-rejects/
          if-no-files-found: ignore

      - name: 运行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} — ${KERNEL_RELEASE}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| root | ${ROOT_IMPL} |"
            echo "| SUSFS | ${SUSFS} |"
            echo "| NoMount / BBG | ${NOMOUNT} / ${BBG} |"
            echo "| NTSync / Networking | ${NTSYNC} / ${NETWORKING} |"
            echo "| BPF / DroidSpaces / Unicode | ${BPF} / ${DROIDSPACES} / ${UNICODE} |"
            echo "| 源码 tag | ${KERNEL_TAG}（project/device.env 锁定） |"
            echo "| 产物 | \`${BOOT_NAME}.img\` |"
            echo ""
            if [ -f "dist/build-info-${{ matrix.name }}.md" ]; then
              cat "dist/build-info-${{ matrix.name }}.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 所有包发到同一个 Release：一条 tag、一个页面，下载不用到处找。
  # needs 里带上 build 但用 always()，这样某个管理器编挂了也不影响其它包发布。
  # ---------------------------------------------------------------------------
  publish:
    name: publish release
    needs: [resolve, build]
    if: ${{ always() && inputs.release != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tag 名和发布说明标题都要用锁定的内核版本
      - name: 读取锁定的机型/内核基准
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^[A-Z][A-Z0-9_]*=' project/device.env >> "$GITHUB_ENV"

      - name: 下载产物
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: boot-warsaw-*
          path: dl
          # 填了 publish_run_id 就取那次运行的产物；否则取本次运行
          run-id: ${{ inputs.publish_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 汇总发布说明
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl dist

          # 不要用固定层级通配。artifact 内部的相对路径取决于上传时各 path 的
          # 公共父目录：我们把 dist/*.img 和根目录的 prepare.log 一起上传，
          # 公共父目录就是工作区根，于是 artifact 里是 dist/xxx.img ——
          # 下载后变成 dl/<artifact>/dist/xxx.img，写死 dl/*/*.img 一定是空的。
          mapfile -t imgs < <(find dl -type f -name '*.img' | sort)
          echo "count=${#imgs[@]}" >> "$GITHUB_OUTPUT"
          echo "共 ${#imgs[@]} 个包"
          find dl -type f | sort | sed 's/^/  /'

          # 展平到 dist/ 供上传 Release（附件名不能带目录）
          for f in "${imgs[@]}"; do cp -f "$f" "dist/$(basename "$f")"; done
          mapfile -t zips < <(find dl -type f -name 'ak3-*.zip' | sort)
          for f in "${zips[@]}"; do cp -f "$f" "dist/$(basename "$f")"; done
          mapfile -t infos < <(find dl -type f -name 'build-info-*.md' | sort)
          for f in "${infos[@]}"; do cp -f "$f" "dist/$(basename "$f")"; done

          {
            echo "# K90 Ultra (warsaw) GKI — ${{ env.KERNEL_RELEASE }}"
            echo
            echo "同一份源码、同一份配置，只有 root 不同。刷哪个就装哪个的管理器 APK。"
            echo
            echo "两种刷法，内容完全一致："
            echo
            echo "- \`.img\`：电脑上 \`fastboot flash boot xxx.img\`"
            echo "- \`.zip\`：AnyKernel3 包，在 recovery / 内核管理器里直接刷（手机上就能刷）"
            echo
            echo "| boot.img | 大小 |"
            echo "| --- | --- |"
          } > dist/RELEASE.md

          for f in "${imgs[@]}"; do
            echo "| \`$(basename "$f")\` | $(stat -c %s "$f") 字节 |" >> dist/RELEASE.md
          done

          if [ "${#zips[@]}" -gt 0 ]; then
            echo >> dist/RELEASE.md
            echo "| AnyKernel3 | 大小 |" >> dist/RELEASE.md
            echo "| --- | --- |" >> dist/RELEASE.md
            for f in "${zips[@]}"; do
              echo "| \`$(basename "$f")\` | $(stat -c %s "$f") 字节 |" >> dist/RELEASE.md
            done
          fi

          if [ "${#infos[@]}" -gt 0 ]; then
            echo >> dist/RELEASE.md
            for f in "${infos[@]}"; do
              echo "---" >> dist/RELEASE.md
              cat "$f" >> dist/RELEASE.md
              echo >> dist/RELEASE.md
            done
          fi

          cat dist/RELEASE.md >> "$GITHUB_STEP_SUMMARY"

      - name: 创建 Release
        if: steps.collect.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: warsaw-${{ env.KERNEL_RELEASE }}-${{ github.run_number }}
          name: K90 Ultra GKI ${{ env.KERNEL_RELEASE }} (run ${{ github.run_number }})
          body_path: dist/RELEASE.md
          files: |
            dist/*.img
            dist/ak3-*.zip
            dist/build-info-*.md
          prerelease: ${{ inputs.release == 'prerelease' }}
          make_latest: false
          fail_on_unmatched_files: false

      - name: 没有产物可发布
        if: steps.collect.outputs.count == '0'
        shell: bash
        run: |
          echo "::warning::没找到任何 boot-warsaw-* 产物，本次不创建 Release"
          echo "常见原因：所有矩阵任务都失败（看各 job 的日志），"
          echo "或者产物上传步骤在编译失败后被跳过了。"
          exit 0
