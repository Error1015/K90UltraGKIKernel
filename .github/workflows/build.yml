name: Build K90 Ultra GKI

# ---------------------------------------------------------------------------
# 一次运行出两份包（矩阵并行）：
#   vanilla —— 纯内核，不带 root。用来证明"内核本身能在这台机器上启动"。
#   sukisu  —— 内置 SukiSU-Ultra（+ 可选 SUSFS）。
#
# 两份都是 **完整 boot 分区镜像**（96MB，含 vbmeta 与 AVB footer，ramdisk_size=0），
# 用 `fastboot flash boot` 刷入。不用 AnyKernel3 —— 它只写内核，
# 会把 footer 指向的 vbmeta 覆盖掉，结果就是卡 logo。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: '手机 uname -r 的版本（如 6.6.118），会锁到同版本的 ACK tag'
        required: true
        default: '6.6.118'
      kernel_tag:
        description: '直接指定 ACK tag（填了就忽略 kernel_release）'
        required: false
        default: ''
      root:
        description: 'root 实现'
        type: choice
        options: [sukisu-ultra, none]
        default: sukisu-ultra
      susfs:
        description: '集成 SUSFS（需要 root 不为 none）'
        type: boolean
        default: true
      localversion:
        description: '版本串后缀（保留 -android15-8 前缀，别破坏 KMI 标识）'
        required: true
        default: '-android15-8-warsaw-4k'
      release:
        description: '发布方式'
        type: choice
        options: [release, prerelease, none]
        default: release

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: matrix.name == 'vanilla' || inputs.root != 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vanilla
            root: none
            susfs: 'false'
          - name: sukisu
            root: ${{ inputs.root }}
            susfs: ${{ inputs.susfs }}

    env:
      ANDROID_BRANCH: android15-6.6
      KERNEL_RELEASE: ${{ inputs.kernel_release }}
      KERNEL_TAG: ${{ inputs.kernel_tag }}
      ROOT_IMPL: ${{ matrix.root }}
      SUSFS: ${{ matrix.susfs }}
      LOCALVERSION: ${{ inputs.localversion }}
      VARIANT: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理磁盘
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -1

      - name: 安装依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 rsync cpio kmod zip unzip dwarves git curl ca-certificates
          pahole --version || true

      - name: 准备源码 / root / 配置
        shell: bash
        run: bash project/prepare.sh 2>&1 | tee prepare.log

      - name: 编译内核
        shell: bash
        run: bash project/build.sh 2>&1 | tee build-step.log

      - name: 打包 boot.img（AVB 感知）
        run: |
          set -euo pipefail
          NAME="boot-warsaw-${{ matrix.name }}-${KERNEL_RELEASE}"
          python3 project/pack.py pack dist/Image "dist/${NAME}.img"
          echo "BOOT_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: 产物验收
        run: |
          set -euo pipefail
          SUB="${KERNEL_RELEASE##*.}"
          python3 project/verify.py \
            --boot "dist/${BOOT_NAME}.img" \
            --image dist/Image \
            --root "${ROOT_IMPL}" \
            --susfs "${SUSFS}" \
            --sublevel "$SUB" \
            --out "dist/build-info-${{ matrix.name }}.md"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOOT_NAME }}
          path: |
            dist/*.img
            dist/Image
            dist/build-info-*.md
            dist/kernel-version.txt
            prepare.log
            build-step.log
          if-no-files-found: error
          compression-level: 1

      - name: 收集补丁 reject（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejects-${{ matrix.name }}
          path: patch-rejects/
          if-no-files-found: ignore

      - name: 发布 Release
        if: ${{ inputs.release != 'none' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: warsaw-${{ matrix.name }}-${{ inputs.kernel_release }}-${{ github.run_number }}
          name: K90 Ultra ${{ matrix.name }} (${{ inputs.kernel_release }})
          body_path: dist/build-info-${{ matrix.name }}.md
          files: |
            dist/*.img
            dist/Image
            dist/build-info-*.md
          prerelease: ${{ inputs.release == 'prerelease' }}
          make_latest: false
          fail_on_unmatched_files: false

      - name: 运行摘要
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }} — ${KERNEL_RELEASE}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| root | ${ROOT_IMPL} |"
            echo "| SUSFS | ${SUSFS} |"
            echo "| 源码 tag | ${KERNEL_TAG:-按版本自动解析} |"
            echo "| 产物 | \`${BOOT_NAME}.img\` |"
            echo ""
            if [ -f "dist/build-info-${{ matrix.name }}.md" ]; then
              cat "dist/build-info-${{ matrix.name }}.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
