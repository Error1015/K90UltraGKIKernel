name: Build K90 Ultra GKI

# ---------------------------------------------------------------------------
# 一次运行出两份包（矩阵并行）：
#   vanilla —— 纯内核，不带 root。用来证明"内核本身能在这台机器上启动"。
#   <root>  —— 选定的 root 管理器（默认 bakasu）+ 可选 SUSFS / 附加功能。
#
# 两份都是 **完整 boot 分区镜像**（96MB，含 vbmeta 与 AVB footer，ramdisk_size=0），
# 用 `fastboot flash boot` 刷入。不用 AnyKernel3 —— 它只写内核，
# 会把 footer 指向的 vbmeta 覆盖掉，结果就是卡 logo。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: '手机 uname -r 的版本（如 6.6.118），会锁到同版本的 ACK tag'
        required: true
        default: '6.6.118'
      kernel_tag:
        description: '直接指定 ACK tag（填了就忽略 kernel_release）'
        required: false
        default: ''
      root:
        description: 'root 实现（bakasu 单个 / all 一次出全部 5 个）'
        type: choice
        options: [bakasu, all, sukisu-ultra, kernelsu, kernelsu-next, kowsu, none]
        default: bakasu
      susfs:
        description: 'SUSFS（选 kowsu 时会自动关掉）'
        type: boolean
        default: true

      # ---- 附加功能（默认全关，一次只加一层）----
      nomount:
        description: '附加：NoMount（VFS 层无挂载点伪装）'
        type: boolean
        default: false
      bbg:
        description: '附加：Baseband Guard（保护 efs/modem）'
        type: boolean
        default: false
      ntsync:
        description: '附加：NTSync（Proton/Wine 同步原语）'
        type: boolean
        default: false
      networking:
        description: '附加：BBRv3 + IPSet + CIFS'
        type: boolean
        default: false
      bpf:
        description: '附加：BTF/eBPF（出厂已是 y，一般无需勾）'
        type: boolean
        default: false
      droidspaces:
        description: '附加：DroidSpaces 容器所需 namespace'
        type: boolean
        default: false
      unicode:
        description: '附加：Unicode 绕过修复'
        type: boolean
        default: false

      localversion:
        description: '版本串后缀（保留 -android15-8 前缀，别破坏 KMI 标识）'
        required: true
        default: '-android15-8-warsaw-4k'
      release:
        description: '发布方式'
        type: choice
        options: [release, prerelease, none]
        default: release

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 先算矩阵。
  # GitHub 的 job 级 if 是在展开矩阵之前求值的，那里没有 matrix 上下文
  # （写 if: matrix.xxx 会直接报 Unrecognized named-value: 'matrix'），
  # 所以"要不要跑第二条腿"必须在这一步决定，输出一个干净的 JSON。
  # ---------------------------------------------------------------------------
  resolve:
    name: resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        shell: bash
        env:
          ROOT_INPUT: ${{ inputs.root }}
          SUSFS_INPUT: ${{ inputs.susfs }}
          NOMOUNT_INPUT: ${{ inputs.nomount }}
          BBG_INPUT: ${{ inputs.bbg }}
          NTSYNC_INPUT: ${{ inputs.ntsync }}
          NETWORKING_INPUT: ${{ inputs.networking }}
          BPF_INPUT: ${{ inputs.bpf }}
          DROIDSPACES_INPUT: ${{ inputs.droidspaces }}
          UNICODE_INPUT: ${{ inputs.unicode }}
        run: |
          set -euo pipefail
          M="$(python3 project/matrix.py)"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "构建矩阵: $M"

  build:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    env:
      ANDROID_BRANCH: android15-6.6
      KERNEL_RELEASE: ${{ inputs.kernel_release }}
      KERNEL_TAG: ${{ inputs.kernel_tag }}
      ROOT_IMPL: ${{ matrix.root }}
      SUSFS: ${{ matrix.susfs }}
      NOMOUNT: ${{ matrix.nomount }}
      BBG: ${{ matrix.bbg }}
      NTSYNC: ${{ matrix.ntsync }}
      NETWORKING: ${{ matrix.networking }}
      BPF: ${{ matrix.bpf }}
      DROIDSPACES: ${{ matrix.droidspaces }}
      UNICODE: ${{ matrix.unicode }}
      LOCALVERSION: ${{ inputs.localversion }}
      VARIANT: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理磁盘
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h / | tail -1

      - name: 安装依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 rsync cpio kmod zip unzip dwarves git curl ca-certificates
          pahole --version || true

      - name: 准备源码 / root / 补丁 / 配置
        shell: bash
        run: bash project/prepare.sh 2>&1 | tee prepare.log

      - name: 编译内核
        shell: bash
        run: bash project/build.sh 2>&1 | tee build-step.log

      - name: 打包 boot.img（AVB 感知）
        shell: bash
        run: |
          set -euo pipefail
          NAME="boot-warsaw-${{ matrix.name }}-${KERNEL_RELEASE}"
          python3 project/pack.py pack dist/Image "dist/${NAME}.img"
          echo "BOOT_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: 产物验收
        shell: bash
        run: |
          set -euo pipefail
          python3 project/verify.py \
            --boot "dist/${BOOT_NAME}.img" \
            --image dist/Image \
            --root "${ROOT_IMPL}" \
            --susfs "${SUSFS}" \
            --sublevel "${KERNEL_RELEASE##*.}" \
            --out "dist/build-info-${{ matrix.name }}.md"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOOT_NAME }}
          path: |
            dist/*.img
            dist/Image
            dist/build-info-*.md
            dist/kernel-version.txt
            prepare.log
            build-step.log
          if-no-files-found: error
          compression-level: 1

      - name: 收集补丁 reject（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejects-${{ matrix.name }}
          path: patch-rejects/
          if-no-files-found: ignore

      - name: 运行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} — ${KERNEL_RELEASE}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| root | ${ROOT_IMPL} |"
            echo "| SUSFS | ${SUSFS} |"
            echo "| NoMount / BBG | ${NOMOUNT} / ${BBG} |"
            echo "| NTSync / Networking | ${NTSYNC} / ${NETWORKING} |"
            echo "| BPF / DroidSpaces / Unicode | ${BPF} / ${DROIDSPACES} / ${UNICODE} |"
            echo "| 源码 tag | ${KERNEL_TAG:-按版本自动解析} |"
            echo "| 产物 | \`${BOOT_NAME}.img\` |"
            echo ""
            if [ -f "dist/build-info-${{ matrix.name }}.md" ]; then
              cat "dist/build-info-${{ matrix.name }}.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 所有包发到同一个 Release：一条 tag、一个页面，下载不用到处找。
  # needs 里带上 build 但用 always()，这样某个管理器编挂了也不影响其它包发布。
  # ---------------------------------------------------------------------------
  publish:
    name: publish release
    needs: [resolve, build]
    if: ${{ always() && inputs.release != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载本次构建的全部产物
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: boot-warsaw-*
          path: dist

      - name: 汇总发布说明
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          imgs=(dist/*/*.img)
          echo "count=${#imgs[@]}" >> "$GITHUB_OUTPUT"
          echo "共 ${#imgs[@]} 个包"

          {
            echo "# K90 Ultra (warsaw) GKI — ${{ inputs.kernel_release }}"
            echo
            echo "一次运行构建的全部产物：同一份源码、同一份配置，只有 root 不同。"
            echo "刷哪个就装哪个的管理器 APK，详见下方各包说明。"
            echo
            echo "| 包 | 大小 |"
            echo "| --- | --- |"
          } > dist/RELEASE.md

          for f in "${imgs[@]}"; do
            echo "| \`$(basename "$f")\` | $(stat -c %s "$f") 字节 |" >> dist/RELEASE.md
          done

          echo >> dist/RELEASE.md
          for f in dist/*/build-info-*.md; do
            [ -f "$f" ] || continue
            echo "---" >> dist/RELEASE.md
            cat "$f" >> dist/RELEASE.md
            echo >> dist/RELEASE.md
          done

          cat dist/RELEASE.md >> "$GITHUB_STEP_SUMMARY"

      - name: 创建 Release
        if: steps.collect.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: warsaw-${{ inputs.kernel_release }}-${{ github.run_number }}
          name: K90 Ultra GKI ${{ inputs.kernel_release }} (run ${{ github.run_number }})
          body_path: dist/RELEASE.md
          files: |
            dist/*/*.img
            dist/*/build-info-*.md
            dist/*/kernel-version.txt
          prerelease: ${{ inputs.release == 'prerelease' }}
          make_latest: false
          fail_on_unmatched_files: false

      - name: 没有产物可发布
        if: steps.collect.outputs.count == '0'
        shell: bash
        run: |
          echo "::warning::所有矩阵任务都失败了，本次不创建 Release"
          exit 0
